services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routeXflow_api
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: routeXflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeXFlow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manson12469
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: